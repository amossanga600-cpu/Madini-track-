name: Madini Track CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  db-and-backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Regenerate migration (lazima iendane na faili zilizo kwenye repo)
        run: python tools/gen_v8.py && git diff --exit-code
      - name: Migration + SQLite tests (Python)
        run: python -m unittest discover -s tools/db_tests -v
      - name: Backend core tests
        run: python -m pip install "psycopg[binary]" && python -m unittest discover -s backend/tests -v

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - name: Install SQLite (kwa sqflite_common_ffi)
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Format check
        working-directory: mobile
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        working-directory: mobile
        run: flutter analyze --no-fatal-infos
      - name: Tests
        working-directory: mobile
        run: flutter test
      - name: Build APK
        working-directory: mobile
        run: flutter build apk --release
      - name: Build AAB
        working-directory: mobile
        run: flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: Madini-Track-APK-AAB
          path: |
            mobile/build/app/outputs/flutter-apk/app-release.apk
            mobile/build/app/outputs/bundle/release/app-release.aab
          retention-days: 14
